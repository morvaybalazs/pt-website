[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=utf-8"

# Pictures and video are cached for a day. If you replace one of these files with a
# different picture, give the new file a different name (for example hero-2.jpg) and
# update the pages that use it, so returning visitors do not keep the old one.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Font files never change. Replacing one means giving it a new name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Notes for whoever works on the site are not part of the public site
[[redirects]]
  from = "/dev/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/blog/consistency"
  to = "/blog-consistency.html"
  status = 301

[[redirects]]
  from = "/blog/rest-days"
  to = "/blog-rest-days.html"
  status = 301

[[redirects]]
  from = "/blog/glp1-maintenance"
  to = "/blog-glp1.html"
  status = 301
